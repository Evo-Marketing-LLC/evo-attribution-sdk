name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build with Swift Package Manager
        run: swift build
      - name: Test with Swift Package Manager
        run: swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme EVOAttribution
          -destination 'generic/platform=iOS Simulator'
          build
      - name: Test on iOS Simulator
        run: |
          EVO_SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$EVO_SIMULATOR_ID"
          xcodebuild -scheme EVOAttribution \
            -destination "platform=iOS Simulator,id=$EVO_SIMULATOR_ID" \
            test

  react-native:
    name: React Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
